services:
  frontend:
    container_name: pengin_party_frontend
    build:
      context: '.'
      dockerfile: './frontend/Dockerfile'
    volumes:
      - ./frontend/my-app:/app
    environment:
      - WATCHPACK_POLLING=true
    tty: true
    # command: sh -c "npm install && npm run dev"
    # command: sh -c "yarn install && yarn dev" # yarnだとうまくいかない
    ports:
      - "3000:3000"
    networks:
      - pengin_party

  backend:
    container_name: pengin_party_backend
    build:
      context: '.'
      dockerfile: './backend/Dockerfile'
    volumes:
      - ./backend:/go/pengin_party
    environment:
      - WATCHPACK_POLLING=true
    stdin_open: true
    tty: true
    ports:
      - "4000:4000"
      - "8080:8080" # air用
    networks:
      - pengin_party

  mysql-db:
    container_name: mysql-db
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      pengin_party:
        aliases:
          - db

  redis:
    image: redis:8.4.0
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - pengin_party
    volumes:
      - redis_data:/data

  websocket-server:
    container_name: websocket-server
    build:
      context: '.'
      dockerfile: './websocket/Dockerfile'
    volumes:
      - ./websocket:/app
    environment:
      - WATCHPACK_POLLING=true
    tty: true
    ports:
      - "3001:3001"
    networks:
      - pengin_party

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - pengin_party
    depends_on:
      - redis

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    environment:
      - PMA_HOST=mysql-db
      - PMA_PORT=3306
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "8082:80"
    networks:
      - pengin_party
    depends_on:
      - mysql-db

volumes:
  mysql_data:
  redis_data:

networks:
  pengin_party:
    driver: bridge